<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reset your password &middot; Account</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f4f6fb;
      color: #172033;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #dde3ee;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(23, 32, 51, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    p.lead { margin: 0 0 20px; color: #5b6478; font-size: 0.95rem; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #c8d0e0;
      border-radius: 10px;
      font: inherit;
    }
    input:focus { outline: 2px solid #3b6ef5; outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #2f5fe0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.6; cursor: progress; }
    .hint { margin-top: 8px; color: #5b6478; font-size: 0.85rem; }
    .message { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 0.92rem; display: none; }
    .message--error { display: block; background: #fdecec; color: #8a1f1f; }
    .message--ok { display: block; background: #e9f7ef; color: #1c6b3f; }
    a { color: #2f5fe0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p class="lead">Choose a new password for your <span data-brand-name>Account</span> account.</p>

    <form id="reset-form" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" readonly />

      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required />
      <p class="hint">Use at least 12 characters.</p>

      <label for="password-confirmation">Confirm new password</label>
      <input id="password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" required />

      <button type="submit" id="submit-btn">Set new password</button>
    </form>

    <p class="message" id="message" role="status" aria-live="polite"></p>
    <p class="hint" id="signin-hint" hidden><a href="/">Go to sign in</a></p>
  </main>

  <script src="/assets/js/reset-password.js"></script>
</body>
</html>
